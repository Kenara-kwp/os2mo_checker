[tool.poetry]
name = "os2mo-checker"
version = "0.1.0"
description = "util to help build and execute graphql queries verify results"
authors = ["Kari Witthoeft Pedersen <kari.pedersen@pm.me>"]
license = "MIT"
readme = "README.md"
packages = [{include = "os2mo_checker"}]

[tool.poetry.dependencies]
python = "^3.11"
fastramqpi = "^15"
ipykernel = "^7.3.0"
pydantic = "^1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
debugpy = "^1"
ariadne-codegen = "^0.7"
respx = "^0.21"
rich = "^13"
virtualenv = "^21.1.0"

[tool.ariadne-codegen]
# The default package name is `graphql_client`. Make it more obvious that the
# files are not to be modified manually.
target_package_name = "autogenerated_graphql_client"
target_package_path = "os2mo_checker/"
client_name = "GraphQLClient"
schema_path = "schema.graphql"  # curl -O http://localhost:5000/graphql/v8/schema.graphql
queries_path = "queries.graphql"
include_all_inputs = false
include_all_enums = false
include_comments = false
plugins = [
    # Return values directly when only a single top field is requested
    # "ariadne_codegen.contrib.shorter_results.ShorterResultsPlugin",
    # Add UNSET and UnsetType to generated input types
    "fastramqpi.ariadne.UnsetInputTypesPlugin",
    # Forbid extra fields on the generated BaseModel so typos raise an exception
    "fastramqpi.ariadne.ForbidExtraBaseModelPlugin",
]
[tool.ariadne-codegen.scalars.DateTime]
type = "datetime.datetime"
parse = "fastramqpi.ariadne.parse_graphql_datetime"
[tool.ariadne-codegen.scalars.UUID]
type = "uuid.UUID"
